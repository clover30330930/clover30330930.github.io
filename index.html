<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEPH</title>
    <style id="base-css">
        body {
            background-color: #c0c0c0; 
            color: #000000;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 0;
        }

        a { color: #0000EE; text-decoration: underline; cursor: pointer; }
        a:visited { color: #551A8B; }
        a:active { color: #EE0000; }
        
        a.drifting {
            display: inline-block;
            animation: drift 10s infinite alternate ease-in-out;
        }

        @keyframes drift {
            0% { transform: translate(0px, 0px); }
            33% { transform: translate(10px, -5px); }
            66% { transform: translate(-5px, 8px); }
            100% { transform: translate(8px, 12px); }
        }

        
        .window-panel {
            background: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-bottom: 2px solid #808080;
            border-right: 2px solid #808080;
            padding: 10px;
        }

        .window-inset {
            background: #ffffff;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-bottom: 2px solid #ffffff;
            border-right: 2px solid #ffffff;
            padding: 5px;
        }

        #top-bar {
            display: none;
            background: #000080; 
            color: white;
            padding: 5px 10px;
            align-items: center;
            gap: 10px;
            font-family: 'MS Sans Serif', Tahoma, sans-serif;
            font-size: 14px;
        }

        #top-bar input[type="text"] {
            font-family: 'MS Sans Serif', Tahoma, sans-serif;
            border: 2px inset #ffffff;
            padding: 2px;
            width: 300px;
        }

        .os-btn {
            background: #c0c0c0;
            color: black;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-bottom: 2px solid #808080;
            border-right: 2px solid #808080;
            padding: 2px 10px;
            font-family: 'MS Sans Serif', Tahoma, sans-serif;
            cursor: pointer;
        }
        .os-btn:active {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-bottom: 2px solid #ffffff;
            border-right: 2px solid #ffffff;
        }

        #main-content {
            padding: 20px;
            max-width: 95vw;
            margin: 0 auto;
        }

        #home-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70vh;
        }

        #results-view {
            display: none;
            min-height: 83vh;
            padding: 20px;
            background-size: cover;
            background-repeat: repeat;
            border: 2px inset #ffffff; 
        }

        .result-item {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #999;
            padding: 10px;
            margin-bottom: 15px;
            max-width: 600px;
        }

        .result-title { font-size: 1.1rem; font-weight: bold; }
        .result-url { color: #008000; font-size: 0.85rem; font-family: monospace; }
        .result-snippet { font-size: 0.9rem; margin-top: 5px; }

        #page-view {
            display: none;
            background: #fff;
            min-height: 80vh;
            position: relative;
            overflow: hidden;
            border: 2px inset #ffffff;
        }
    </style>
   
    <style id="page-custom-css"></style>
</head>
<body>

    
    <div id="top-bar">
        <b id="home-logo-btn" style="cursor:pointer; letter-spacing: 2px;">ALEPH</b>
        <input type="text" id="top-search-input" value="">
        <button id="top-search-btn" class="os-btn">Search</button>
    </div>

    <div id="main-content">
        <div id="home-view">
            <h1 style="font-family: 'MS Sans Serif', Tahoma, sans-serif; letter-spacing: 5px; font-size: 3rem; text-shadow: 2px 2px 0px white;">A L E P H</h1>
            <div class="window-panel" style="width: 400px; text-align: center;">
                <div style="margin-bottom: 15px; font-family: 'MS Sans Serif', Tahoma, sans-serif; font-size: 14px;">Vivi's Web Index</div>
                <div class="window-inset">
                    <input type="text" id="home-search-input" style="width: 95%; border: none; outline: none; padding: 5px; font-family: 'Times New Roman';" autofocus>
                </div>
                <button id="home-search-btn-action" class="os-btn" style="margin-top: 15px; width: 100%;">Query Database</button>
            </div>
            <br>
            <marquee width="400" style="font-family: monospace; color: #555;">Search for keywords to navigate!</marquee>
        </div>

        
        <div id="results-view">
            <div class="window-panel" style="margin-bottom: 20px; display: inline-block;">
                Found <span id="result-count">0</span> fragments for: <b id="query-display"></b>
            </div>
            <div id="results-container"></div>
        </div>

        
        <div id="page-view"></div>
    </div>

    <script>
        const SEARCH_BGS = [
            "url('https://i.imgur.com/NBc19LY.png')",
            "url('https://i.imgur.com/c1APieV.gif')",
            "url('https://i.imgur.com/EfNw74P.jpg')",
            "url('https://i.imgur.com/HPVHwH2.png')"
        ];

        const DATABASE = {
            "line_generator": {
                keywords: "line generator thought trajectory canvas drawing pattern graph",
                title: "Cognitive Trajectory Mapper",
                url: "http://tools.aleph/trajectory.exe",
                snippet: "generate a completely new multi-point line graph trajectory every time you click...",
                content: `
                    <div style="padding: 20px; text-align: center;">
                        <h3 style="font-family: 'MS Sans Serif', sans-serif;">Thought Trajectory Engine v1.0</h3>
                        <div class="window-inset" style="display: inline-block; background: #c0c0c0;">
                            <canvas id="thought-canvas" width="500" height="400" style="background: white; border: 2px inset #808080;"></canvas>
                        </div>
                        <br><br>
                        <button class="os-btn" onclick="drawThoughtGraph()" style="padding: 10px; font-weight: bold;">Generate New Line Graph</button>
                        <button class="os-btn" onclick="clearThoughts()">Clear Memory</button>
                        <p style="font-size: 12px; font-family: monospace;">Logging chaotic pathways...</p>
                    </div>
                `
            }
        };

        let thoughtCtx = null;

        function clearCustomState() {
            document.getElementById('page-custom-css').innerHTML = '';
            thoughtCtx = null;
        }

        function goHome() {
            clearCustomState();
            document.getElementById('top-bar').style.display = 'none';
            document.getElementById('results-view').style.display = 'none';
            document.getElementById('page-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'flex';
            document.getElementById('home-search-input').value = '';
            document.body.style.backgroundColor = '#c0c0c0';
        }

        function triggerSearch(source) {
            clearCustomState();
            let inputId = (source === 'home') ? 'home-search-input' : 'top-search-input';
            let inputEl = document.getElementById(inputId);
            let query = inputEl ? inputEl.value.trim().toLowerCase() : "";

            if(!query) return;

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('page-view').style.display = 'none';
            document.getElementById('top-bar').style.display = 'flex';
            
            let resView = document.getElementById('results-view');
            resView.style.display = 'block';
            
            let randomBg = SEARCH_BGS[Math.floor(Math.random() * SEARCH_BGS.length)];
            resView.style.backgroundImage = randomBg;

            document.getElementById('top-search-input').value = query;
            document.getElementById('query-display').innerText = query;

            renderResults(query);
        }

        function renderResults(query) {
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            let keys = Object.keys(DATABASE);
            
            let matchedKeys = keys.filter(k => {
                let d = DATABASE[k];
                let searchStr = (d.title + " " + d.snippet + " " + d.keywords).toLowerCase();
                let queryWords = query.split(" ");
                return queryWords.every(word => searchStr.includes(word));
            });

            let keywordLinks = [];
            if (query.includes("blog") || query.includes("vivi")) {
                keywordLinks.push({
                    title: "/diary/ - the webmaster is thinking",
                    url: "https://clover30330930.github.io/diary",
                    snippet: "vivi's 2024-2026 diary :3"
                });
            }
            if (query.includes("blog") || query.includes("philosophy") || query.includes("vivi")) {
                keywordLinks.push({
                    title: "FEED DA EGREGORE.",
                    url: "https://clover30330930.github.io/gen",
                    snippet: ""
                });
            }
            if (query.includes("music") || query.includes("blog") || query.includes("art")) {
                keywordLinks.push({
                    title: "Music blog",
                    url: "https://clover30330930.github.io/fm",
                    snippet: "billions must scrobble"
                });
            }
            if (query.includes("music") || query.includes("cd") || query.includes("art")) {
                keywordLinks.push({
                    title: "Vivi's really cool CD collection",
                    url: "https://clover30330930.github.io/cd",
                    snippet: "my CD collection catalogued"
                });
            }
            if (query.includes("music") || query.includes("shrine")) {
                keywordLinks.push({
                    title: "STRAWBERRY SWITCHBLADE",
                    url: "https://clover30330930.github.io/shrine/ss",
                    snippet: "DOOMED YURI :( IT'S SO CLEAR THAT ALL WE HAVE NOW ARE OUR THOUGHTS OF YESTERDAY"
                });
            }
            if (query.includes("music") || query.includes("vivi")) {
                keywordLinks.push({
                    title: "CAT'S CRADLE",
                    url: "https://clover30330930.github.io/mu",
                    snippet: ""
                });
            }
            if (query.includes("philosophy") || query.includes("art") || query.includes("blog") || query.includes("vivi")) {
                keywordLinks.push({
                    title: "eternal stagnation vs decay = the same?",
                    url: "https://clover30330930.github.io/pain",
                    snippet: "mental breakdown"
                });
            }
            if (query.includes("blog") || query.includes("angel") || query.includes("suicide")) {
                keywordLinks.push({
                    title: "hospital",
                    url: "https://clover30330930.github.io/hopital",
                    snippet: "dont expect any help, for all the beds are full...but if you're a visitor, by all means, we could use those..."
                });
            }
          if (query.includes("philosophy") || query.includes("tech")) {
                keywordLinks.push({
                    title: "DIGITAL SOLIPSISM FOR DUMMIES:RECLAIM YOUR ECHO CHAMBER",
                    url: "https://clover30330930.github.io/ryec",
                    snippet: "one closed feedback loop now for half the price! ARCHONS WEARING GORILLA GLA$$: THE DEMIURGE IS AN ALGORITHMIC FEED. PROLOGUE: THE SILICON COCKPIT ANCIEN..."
                });
            }
            if (query.includes("philosophy") || query.includes("shrine") || query.includes("lain") || query.includes("art") || query.includes("god") || query.includes("tech") || query.includes("religion")) {
                keywordLinks.push({
                    title: "ENTER WIRED // Serial Experiments Lain",
                    url: "https://clover30330930.github.io/shrine/lain",
                    snippet: "What does it take to make you realize digital deities are real? Do you really not know masturbating to your Touhous is a worship ritual manifesting their existence libidinally? The suspension of disbelief..."
                });
            }

            let totalCount = matchedKeys.length + keywordLinks.length;
            document.getElementById('result-count').innerText = totalCount;

            if (totalCount === 0) {
                container.innerHTML = `
                    <div class="window-panel" style="background: white; color: black; font-weight: bold;">
                        No documents matched the query. The trail goes cold.
                    </div>
                `;
                return;
            }

            for(let i=0; i < matchedKeys.length; i++) {
                let key = matchedKeys[i];
                let data = DATABASE[key];

                let item = document.createElement('div');
                item.className = 'window-panel result-item';

                item.innerHTML = `
                    <div class="result-title"><a class="nav-link" data-target="${key}">${data.title}</a></div>
                    <div class="result-url">${data.url}</div>
                    <div class="result-snippet">${data.snippet}</div>
                `;
                container.appendChild(item);
            }

            for(let k=0; k < keywordLinks.length; k++) {
                let linkData = keywordLinks[k];

                let item = document.createElement('div');
                item.className = 'window-panel result-item';

                item.innerHTML = `
                    <div class="result-title"><a href="${linkData.url}" target="_blank" rel="noopener noreferrer">${linkData.title}</a></div>
                    <div class="result-url">${linkData.url}</div>
                    <div class="result-snippet">${linkData.snippet}</div>
                `;
                container.appendChild(item);
            }

            attachNavListeners();
        }

        function nav(pageId) {
            if(!DATABASE[pageId]) return;
            const pageData = DATABASE[pageId];

            clearCustomState();

            document.getElementById('home-view').style.display = 'none';
            document.getElementById('results-view').style.display = 'none';
            document.getElementById('top-bar').style.display = 'flex';
            document.getElementById('page-view').style.display = 'block';
            
            document.getElementById('page-view').style.backgroundImage = 'none';
            document.getElementById('page-view').innerHTML = pageData.content;
            document.getElementById('top-search-input').value = pageData.url;

            if (pageData.customCss) {
                document.getElementById('page-custom-css').innerHTML = pageData.customCss;
            }

            attachNavListeners();

            if (pageId === "line_generator") {
                initCanvas();
                drawThoughtGraph();
            }

            window.scrollTo(0, 0);
        }

        function attachNavListeners() {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.onclick = (e) => {
                    e.preventDefault();
                    let target = link.getAttribute('data-target');
                    nav(target);
                };
            });
        }

        // --- canvas ---
        function initCanvas() {
            let c = document.getElementById('thought-canvas');
            if(c) {
                thoughtCtx = c.getContext('2d');
            }
        }

        window.drawThoughtGraph = function() {
            if(!thoughtCtx) initCanvas();
            if(!thoughtCtx) return;

            let c = document.getElementById('thought-canvas');
            thoughtCtx.clearRect(0, 0, c.width, c.height);

            thoughtCtx.strokeStyle = '#e0e0e0';
            thoughtCtx.lineWidth = 1;
            for (let x = 0; x < c.width; x += 50) {
                thoughtCtx.beginPath();
                thoughtCtx.moveTo(x, 0);
                thoughtCtx.lineTo(x, c.height);
                thoughtCtx.stroke();
            }
            for (let y = 0; y < c.height; y += 50) {
                thoughtCtx.beginPath();
                thoughtCtx.moveTo(0, y);
                thoughtCtx.lineTo(c.width, y);
                thoughtCtx.stroke();
            }

            
            let points = Math.floor(Math.random() * 71) + 30;
            let step = c.width / (points - 1);
            let coords = [];

            for (let i = 0; i < points; i++) {
                let x = i * step;
                let y = 30 + Math.random() * (c.height - 60);
                coords.push({x, y});
            }

            //  graph line
            thoughtCtx.strokeStyle = '#000080';
            thoughtCtx.lineWidth = 1.5;
            thoughtCtx.beginPath();
            thoughtCtx.moveTo(coords[0].x, coords[0].y);
            for (let i = 1; i < coords.length; i++) {
                thoughtCtx.lineTo(coords[i].x, coords[i].y);
            }
            thoughtCtx.stroke();

            // data points
            for (let i = 0; i < coords.length; i++) {
                thoughtCtx.fillStyle = '#ff0000';
                thoughtCtx.beginPath();
                thoughtCtx.arc(coords[i].x, coords[i].y, 2, 0, 2 * Math.PI);
                thoughtCtx.fill();
            }
        };

        window.clearThoughts = function() {
            if(!thoughtCtx) return;
            let c = document.getElementById('thought-canvas');
            thoughtCtx.clearRect(0, 0, c.width, c.height);
        };

        // evnt bindings
        document.getElementById('home-search-btn-action').addEventListener('click', () => triggerSearch('home'));
        document.getElementById('top-search-btn').addEventListener('click', () => triggerSearch('top'));
        document.getElementById('home-logo-btn').addEventListener('click', goHome);

        document.getElementById('home-search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') triggerSearch('home');
        });
        document.getElementById('top-search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') triggerSearch('top');
        });
    </script>
</body>
</html>
