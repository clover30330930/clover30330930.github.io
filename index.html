<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEPH</title>
    <style id="base-css">
        body {
            background-color: #c0c0c0; 
            color: #000000;
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 0;
        }

        a { color: #0000EE; text-decoration: underline; cursor: pointer; }
        a:visited { color: #551A8B; }
        a:active { color: #EE0000; }
        
        a.drifting {
            display: inline-block;
            animation: drift 10s infinite alternate ease-in-out;
        }

        @keyframes drift {
            0% { transform: translate(0px, 0px); }
            33% { transform: translate(10px, -5px); }
            66% { transform: translate(-5px, 8px); }
            100% { transform: translate(8px, 12px); }
        }

        
        .window-panel {
            background: #c0c0c0;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-bottom: 2px solid #808080;
            border-right: 2px solid #808080;
            padding: 10px;
        }

        .window-inset {
            background: #ffffff;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-bottom: 2px solid #ffffff;
            border-right: 2px solid #ffffff;
            padding: 5px;
        }

        #top-bar {
            display: none;
            background: #000080; 
            color: white;
            padding: 5px 10px;
            align-items: center;
            gap: 10px;
            font-family: 'MS Sans Serif', Tahoma, sans-serif;
            font-size: 14px;
        }

        #top-bar input[type="text"] {
            font-family: 'MS Sans Serif', Tahoma, sans-serif;
            border: 2px inset #ffffff;
            padding: 2px;
            width: 300px;
        }

        .os-btn {
            background: #c0c0c0;
            color: black;
            border-top: 2px solid #ffffff;
            border-left: 2px solid #ffffff;
            border-bottom: 2px solid #808080;
            border-right: 2px solid #808080;
            padding: 2px 10px;
            font-family: 'MS Sans Serif', Tahoma, sans-serif;
            cursor: pointer;
        }
        .os-btn:active {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-bottom: 2px solid #ffffff;
            border-right: 2px solid #ffffff;
        }

        #main-content {
            padding: 20px;
            max-width: 95vw;
            margin: 0 auto;
        }

        #home-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 70vh;
        }

        #results-view {
            display: none;
            min-height: 83vh;
            padding: 20px;
            background-size: cover;
            background-repeat: repeat;
            border: 2px inset #ffffff; 
        }

        .result-item {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #999;
            padding: 10px;
            margin-bottom: 15px;
            max-width: 600px;
        }

        .result-title { font-size: 1.1rem; font-weight: bold; }
        .result-url { color: #008000; font-size: 0.85rem; font-family: monospace; }
        .result-snippet { font-size: 0.9rem; margin-top: 5px; }

        #page-view {
            display: none;
            background: #fff;
            min-height: 80vh;
            position: relative;
            overflow: hidden;
            border: 2px inset #ffffff;
        }
    </style>
   
    <style id="page-custom-css"></style>
</head>
